name: Build and deploy Dockerized Python app to Azure Web App - AI-chatbot-V1

on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN write permission for pushing to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Set Docker image tag
        # Use the commit SHA for a unique, immutable tag
        id: set_tag
        run: echo "IMAGE_TAG=${GITHUB_REPOSITORY_OWNER}/ai-chatbot-v1:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Use the GITHUB_TOKEN secret which is automatically available
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Build and Push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.set_tag.outputs.IMAGE_TAG }}
          # Use your provided Dockerfile
          file: ./Dockerfile
          # Skip the cache to ensure the latest code is built
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AI-chatbot-V1'
          slot-name: 'Production'
          # Your existing Publish Profile secret
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9292702A645045A5A500A36C2E3C7954 }}
          # **Crucial step for container deployment:**
          # Specify the Docker image from GHCR to deploy
          images: 'ghcr.io/${{ steps.set_tag.outputs.IMAGE_TAG }}'

      - name: 🌐 Configure Registry Settings (Optional but Recommended)
        # This step is crucial if your GHCR image is private.
        # It updates the Web App settings to pull from the private registry.
        # However, for GHCR, using a public image or this action might not be needed 
        # if your App Service is configured for GHCR access via a different method (like using a System-Assigned Managed Identity).
        # For simplicity with a Publish Profile, we assume GHCR can be accessed or is public.
        # If your image is private, you might need an Azure Login step and az webapp config container command.
        run: echo "Deployment complete, image: ghcr.io/${{ steps.set_tag.outputs.IMAGE_TAG }}"
